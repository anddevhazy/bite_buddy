name: bite_buddy
description: "Bite Buddy - feed your pet with the meals you actually eat."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  bite_buddy_client:
    path: ../backend/bite_buddy_client
  serverpod_flutter: 3.4.13
  serverpod_auth_idp_flutter: 3.4.13

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  go_router: ^17.0.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^9.2.0
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  camera: ^0.11.3
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^7.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
