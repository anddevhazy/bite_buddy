name: bite_buddy
description: "Bite Buddy - feed your pet with the meals you actually eat."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  bite_buddy_client:
    path: ../backend/bite_buddy_client
  serverpod_flutter: 4.0.4
  serverpod_auth_idp_flutter: 4.0.4

  cupertino_icons: ^2.0.0
  flutter_screenutil: ^5.9.3
  go_router: ^18.1.1
  equatable: ^3.0.0
  dartz: ^0.10.1
  get_it: ^9.2.0
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  camera: ^0.12.1
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^7.0.0
  intl: ^0.20.2
  flame: ^1.38.2
  flame_audio: ^2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/anim/
    - assets/audio/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
