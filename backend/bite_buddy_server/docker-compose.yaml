services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: bite_buddy
      POSTGRES_PASSWORD: "wnIe4fjxs1Oe3Aj36-0tB9AfRsg6jV-v"
    volumes:
      - bite_buddy_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "RyLislBk5bNbDzOE-78SZAg4jMF_hRxm"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: bite_buddy_test
      POSTGRES_PASSWORD: "kW8E9vaehjLBQ3ggjxMl9oOxA7uFJXTx"
    volumes:
      - bite_buddy_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "oTvTovNblnguP0dMO6m1_d2ZCj0VgCZ7"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  bite_buddy_data:
  bite_buddy_test_data:
