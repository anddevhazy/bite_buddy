### What happened in one round of a battle. Stored as JSON on the battle row.
class: BattleRound
fields:
  round: int
  playerMove: BattleMove
  opponentMove: BattleMove
  damageDealt: int
  damageTaken: int
  ### Whether either side landed a critical hit this round.
  playerCritical: bool
  opponentCritical: bool
  ### Short label for how the moves met, e.g. "Guard broken!"; empty when the
  ### moves were the same.
  clash: String
  message: String
