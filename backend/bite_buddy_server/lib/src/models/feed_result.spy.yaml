### The pet after a meal, and how much each stat moved.
class: FeedResult
fields:
  pet: Pet
  healthChange: int
  energyChange: int
  nutritionChange: int
  xpGained: int
  leveledUp: bool
  ### True when this was the first meal of a new streak day.
  streakExtended: bool
  ### Bonus XP for the streak, already included in xpGained.
  streakBonusXp: int
