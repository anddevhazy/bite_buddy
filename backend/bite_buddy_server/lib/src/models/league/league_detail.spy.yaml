### Everything on a league's screen.
class: LeagueDetail
fields:
  id: int
  name: String
  inviteCode: String
  isOwner: bool
  seasonStartsAt: DateTime
  seasonEndsAt: DateTime
  standings: List<LeagueStanding>
  ### The caller's friend battles in this league: active ones, then the most
  ### recent finished ones.
  duels: List<DuelView>
  ### How last week ended, if there was a last week.
  lastSeasonWinner: String?
  lastSeasonYourRank: int?
