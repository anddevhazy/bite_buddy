name: bite_buddy_server
description: The Serverpod backend for Bite Buddy.

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  serverpod: 4.0.4
  serverpod_auth_idp_server: 4.0.4
  crypto: ^3.0.6
  http: ^1.2.2
  image: ^4.12.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.4
  test: ^1.25.5

serverpod:
  # The Flutter app that `serverpod start` launches alongside the server
  # (Ctrl+R in its terminal UI). Extra properties are passed to `flutter run`.
  flutter_apps:
    bite_buddy:
      path: ../../frontend
      displayName: "Bite Buddy"
      auto_launch: false # the phone app is started by frontend/run_device.sh
      target: lib/driver.dart
